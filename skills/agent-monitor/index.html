<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Monitor</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2128;--card:#fff;--muted:#6b7280;--line:#e3e6eb;--edge:#c7ccd4;
  --done:#2ea043;--run:#2e8bff;--wait:#e0a000;--stall:#e0a000;--err:#d33;--text:#7a5cff}
@media (prefers-color-scheme:dark){:root{--bg:#121317;--fg:#e6e8ec;--card:#1c1e24;--muted:#9aa1ad;--line:#2c3038;--edge:#3a3f49}}
*{box-sizing:border-box}
body{font:14px/1.45 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0 auto;padding:16px;max-width:1180px}
h2{margin:4px 0 12px} h2 small{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.panel h3{margin:0 0 6px;font-size:14px}
#graphwrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
#graph{display:block;width:100%;height:320px;touch-action:none;cursor:grab;user-select:none}
#graph.dragging{cursor:grabbing}
.zoom{position:absolute;top:8px;right:8px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px}
.zoom button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;min-width:30px;height:28px;font:13px system-ui;cursor:pointer}
.zoom button:hover{border-color:var(--run)}
.lane-label{font-size:12px;fill:var(--muted);font-weight:600;letter-spacing:.03em}

/* edges */
.edge{fill:none;stroke:var(--edge);stroke-width:2.5;stroke-dasharray:6 6}
.edge.done{stroke:var(--done);stroke-dasharray:none;opacity:.8}
.edge.active{stroke:var(--run);stroke-dasharray:10 8;animation:flow .8s linear infinite}
.edge.drawn{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1s ease-out forwards}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes draw{to{stroke-dashoffset:0}}
.packet{fill:var(--run);filter:drop-shadow(0 0 4px var(--run))}

/* nodes */
.node rect.box{fill:var(--card);stroke:var(--edge);stroke-width:2;stroke-dasharray:5 4}
.node .title{font-size:13px;font-weight:600;fill:var(--fg)}
.node .sub,.node .meta{font-size:11px;fill:var(--muted)}
.node .doing{font:11px ui-monospace,Menlo,monospace;fill:var(--fg);opacity:.8}
.node .errs{fill:var(--err)}
.node{cursor:pointer;outline:none}
.node:hover rect.box,.node:focus-visible rect.box{stroke-width:3}
.node.sel rect.box{stroke-width:3.5;stroke-dasharray:none}
.node .ring-bg{fill:none;stroke:var(--line);stroke-width:4}
.node .ring{fill:none;stroke-width:4;stroke-linecap:round;transform-box:fill-box;transform-origin:center}
.node.pending{opacity:.55}
.node.done rect.box{stroke:var(--done);stroke-dasharray:none;fill:color-mix(in srgb,var(--done) 9%,var(--card))}
.node.done .ring{stroke:var(--done);stroke-dasharray:63;stroke-dashoffset:63;animation:fill 1s ease-out forwards}
.node.done .check{stroke:var(--done);stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:20;stroke-dashoffset:20;animation:fill .5s .7s ease-out forwards}
@keyframes fill{to{stroke-dashoffset:0}}
.node.running rect.box{stroke:var(--run);stroke-dasharray:none;fill:color-mix(in srgb,var(--run) 9%,var(--card));animation:glow 1.6s ease-in-out infinite}
.node.running .ring{stroke:var(--run);stroke-dasharray:22 41;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--run) 60%,transparent))}}
.node.waiting rect.box,.node.stalled rect.box{stroke:var(--wait);stroke-dasharray:none;fill:color-mix(in srgb,var(--wait) 12%,var(--card));animation:blink 1.4s ease-in-out infinite}
.node.waiting .ring,.node.stalled .ring{stroke:var(--wait);stroke-dasharray:4 6}
@keyframes blink{50%{stroke-opacity:.3}}  /* not fill: Chrome animates a var()/color-mix fill to black */
.node .pause rect{fill:var(--wait)}
.node.hub.waiting .title,.now .wait b{fill:var(--wait);color:var(--wait)}
.node .bars rect{fill:var(--run);opacity:.85;transform-box:fill-box;transform-origin:bottom;animation:eq 1s ease-in-out infinite}
.node .bars rect:nth-child(2){animation-delay:.2s}.node .bars rect:nth-child(3){animation-delay:.4s}
@keyframes eq{50%{transform:scaleY(.3)}}

.now{font:12px ui-monospace,Menlo,monospace;color:var(--muted);margin-top:6px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now b{color:var(--run)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* agent cards */
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid #888;border-radius:8px;margin:10px 0;padding:10px 14px}
.card.running,.card.active{border-left-color:var(--run)} .card.waiting{border-left-color:var(--wait)}
.ask{color:var(--wait);font-weight:600;margin-left:6px} .card.idle{border-left-color:var(--edge)}
.group{font-size:14px;margin:18px 0 4px} .group small{color:var(--muted);font-weight:400}
.cost{color:var(--done);font-weight:600} .card.stalled{border-left-color:var(--stall)} .card.done{border-left-color:var(--done)}
summary{cursor:pointer} summary small{display:block;color:var(--muted);margin-top:3px}
.st{text-transform:uppercase;font-size:11px;letter-spacing:.05em;margin-right:6px}
ol{list-style:none;padding:0;margin:8px 0 0;font:12px/1.5 ui-monospace,Menlo,monospace;max-height:340px;overflow:auto}
li{padding:2px 0;border-top:1px solid var(--line);word-break:break-word} li span{color:var(--muted)}
li.text{color:var(--text)} li.error{color:var(--err)}
.card.fresh{animation:slidein .4s ease-out}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.tab{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:4px 10px;font:12px system-ui;cursor:pointer;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.sel{border-color:var(--run);background:color-mix(in srgb,var(--run) 14%,var(--card))}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.tab.live .dot{background:var(--run);animation:glow 1.6s infinite}
.tab.waiting{border-color:var(--wait)} .tab.waiting .dot{background:var(--wait);animation:none}
.ptitle-sub{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
/* hover tooltip and detail drawer */
#tip{position:fixed;z-index:20;pointer-events:none;max-width:340px;background:var(--fg);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:12px;white-space:pre-line;opacity:0;transition:opacity .12s}
#tip.on{opacity:.95}
#drawer{position:fixed;top:0;right:0;z-index:10;height:100%;width:min(480px,100vw);display:flex;flex-direction:column;background:var(--card);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .2s ease-out;visibility:hidden}
#drawer.open{transform:none;visibility:visible}
#drawer header{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
#drawer header h3{margin:0;font-size:15px;flex:1;word-break:break-word}
#drawer header button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:16px}
#dbody{overflow:auto;padding:12px 16px 24px;flex:1}
#dbody h4{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#dbody pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border-radius:8px;padding:8px 10px;margin:0;max-height:280px;overflow:auto}
#dbody ol{max-height:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:0} .kv dt{color:var(--muted)} .kv dd{margin:0}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;color:#fff;background:var(--muted);margin-right:4px}
.pill.running{background:var(--run)} .pill.done{background:var(--done)} .pill.waiting,.pill.stalled{background:var(--wait)} .pill.err{background:var(--err)}
li .ok{color:var(--done)} li .bad{color:var(--err)} li b{color:var(--fg)}
/* tree view: cards left to right, curved connectors, ▸/▾ folds a branch */
#graph.tree .node .title{font-size:14px} #graph.tree .node .meta,#graph.tree .node .sub,#graph.tree .node .doing{font-size:13px}
.edge.wait{stroke:var(--wait)}
.tog{cursor:pointer;outline:none} .tog circle{fill:var(--card);stroke:var(--edge);stroke-width:1.5}
.tog text{font-size:13px;fill:var(--fg);pointer-events:none} .tog:hover circle,.tog:focus-visible circle{stroke:var(--fg);stroke-width:2.5}
.badge{font-size:13px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.badge .done{fill:var(--done)} .badge .running,.badge .stalled{fill:var(--run)} .badge .waiting{fill:var(--wait)} .badge .error,.badge .failed{fill:var(--err)}
.panel:not(.tree) .tonly{display:none}
@media (max-width:600px){#graphwrap{display:flex;flex-direction:column}.zoom{position:static;order:-1;justify-content:flex-start;padding:6px;border-bottom:1px solid var(--line)}}
/* lanes board: one row per lane, stage cards left to right */
.vsw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;float:right;margin-left:8px}
.vsw button{border:0;background:var(--card);color:var(--fg);font:13px system-ui;padding:4px 10px;cursor:pointer}
.vsw button[aria-pressed=true]{background:color-mix(in srgb,var(--run) 16%,var(--card));font-weight:600}
.panel.lanes #graphwrap,.panel.lanes #now,.panel.lanes .legend .gonly,.panel:not(.lanes) #board{display:none}
#board h4{margin:10px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#board h4.live{color:var(--run)}
.lane{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;border-top:1px solid var(--line);padding:6px 0}
.lhead{display:flex;align-items:baseline;gap:6px;max-width:100%;border:0;background:none;color:var(--fg);font:14px system-ui;text-align:left;padding:4px 2px;cursor:pointer;border-radius:6px}
.lhead:hover,.lhead:focus-visible{background:color-mix(in srgb,var(--run) 7%,transparent)}
.lhead .caret{width:1em;color:var(--muted)} .lhead .lname{font-weight:600;flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
.lmeta{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 auto;min-width:0}
.chip,.scard{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;font:13px system-ui;padding:2px 9px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover,.chip:focus-visible,.scard:hover,.scard:focus-visible,.chip.sel,.scard.sel{border-color:var(--fg)}
.ic{font-weight:700;margin-right:4px} .done .ic{color:var(--done)} .running .ic,.stalled .ic{color:var(--run)}
.waiting .ic{color:var(--wait)} .error .ic,.failed .ic{color:var(--err)} .pending{color:var(--muted)}
.cards{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;flex-basis:100%;padding:2px 0 4px 1.4em}
.scard{display:flex;flex-direction:column;gap:2px;text-align:left;border-radius:10px;padding:8px 10px;flex:1 1 210px;max-width:320px;white-space:normal;border-left:4px solid var(--edge)}
.scard.done{border-left-color:var(--done)} .scard.running,.scard.stalled{border-left-color:var(--run)} .scard.waiting{border-left-color:var(--wait)} .scard.error,.scard.failed{border-left-color:var(--err)}
.scard.running{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--run) 22%,transparent)}}
.scard b{font-size:14px;overflow-wrap:anywhere} .scard small{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.scard .doing{font:13px ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .errs{color:var(--err)}
/* progress and estimates: history medians, always labelled "estimate" */
.node .est{font-size:12px;fill:var(--muted)} .node .est.over,.node .ago.stall{fill:var(--wait)}
.node .ago{font-size:12px;fill:var(--muted)} .node .adot,.adot{fill:var(--run);background:var(--run);transform-box:fill-box;transform-origin:center;animation:dot 2s ease-in-out infinite}
.node .adot.stall,.adot.stall{fill:var(--wait);background:var(--wait);animation:none}
@keyframes dot{50%{opacity:.45}}
.node .pbar rect{fill:var(--line)} .node .pbar rect+rect{fill:var(--done)}
.prog{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;align-self:center}
.prog i{display:block;height:100%;background:var(--done)} .lprog{color:var(--muted);font-size:13px;white-space:nowrap}
.adot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.scard .est.over,.scard .act.stall{color:var(--wait)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<h2>Agent Monitor <small id="counts">loading…</small></h2>
<section class="panel">
  <div class="tabs" id="tabs" role="tablist" aria-label="Sessions"></div>
  <div class="vsw" role="group" aria-label="View"><button data-view="tree">Tree</button><button data-view="lanes">Lanes</button><button data-view="flow">Flow</button></div>
  <h3><span id="ptitle">Orchestration</span><span class="ptitle-sub" id="psub"></span></h3>
  <div id="graphwrap">
    <svg id="graph" role="group" aria-label="Orchestration graph: click a node for details, drag to pan, wheel to zoom"></svg>
    <div class="zoom"><button id="zin" title="Zoom in" aria-label="Zoom in">+</button><button id="zout" title="Zoom out" aria-label="Zoom out">−</button><button id="texp" class="tonly">Expand all</button><button id="tcol" class="tonly">Collapse finished</button><button id="zfit" title="Fit the whole graph">Fit</button></div>
  </div>
  <div id="board"></div>
  <div class="now" id="now"></div>
  <div class="legend">
    <span><i style="background:var(--done)"></i>done</span>
    <span><i style="background:var(--run)"></i>running</span>
    <span><i style="background:var(--wait)"></i>waiting on you / stalled</span>
    <span class="gonly"><i style="background:var(--err)"></i>has tool errors</span>
    <span><i style="border:1px dashed var(--muted)"></i>pending</span>
    <span id="hint"></span>
  </div>
</section>
<div id="cards"></div>
<div id="tip" role="tooltip"></div>
<aside id="drawer" role="dialog" aria-labelledby="dtitle" aria-hidden="true">
  <header><h3 id="dtitle"></h3><button id="dclose" title="Close (Esc)" aria-label="Close details">×</button></header>
  <div id="dbody"></div>
</aside>

<script>
const NS = 'http://www.w3.org/2000/svg';
const W = 248, H = 92, GX = 46, ROW_H = 136, PAD_X = 16, PAD_Y = 34, HUB_W = 120;
let sig = '', fetchedAt = 0, drawn = [], seenCards = new Set(), opened = new Set(), closed = new Set();
let selected = null, last = null, openKey = null, detail = null;
try { selected = new URLSearchParams(location.search).get('s') || localStorage.getItem('agentmon.session'); } catch (e) {}

const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const fmt = s => s >= 3600 ? `${Math.floor(s / 3600)}h${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}m`
  : `${Math.floor(s / 60)}m${String(Math.floor(s % 60)).padStart(2, '0')}s`;
const cut = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;
const STATE = {running: 'running', 'stalled?': 'stalled', done: 'done', waiting: 'waiting'};
const STATE_TXT = {running: 'running', waiting: 'waiting on you', done: 'done', stalled: 'stalled?', pending: 'pending'};

// the node's short summary: what it is, its state, and what it is doing now
const nodeMeta = n => [n.type || (n.agents ? 'question' : 'stage'), STATE_TXT[n.state] || n.state].join(' · ');
function nodeDoing(n) {
  if (n.state === 'waiting') return `⏸ ${n.ask || n.note || 'waiting on you'}`;
  if (n.state === 'pending') return n.note || 'not started';
  return n.last ? `${n.state === 'running' ? '▶ ' : ''}${n.last}` : '—';
}

function subText(n, extra = 0) {
  const usd = n.usd ? ` · $${n.usd.toFixed(2)}` : '';
  if (n.state === 'running') return `${fmt(n.elapsed + extra)} · ${n.tools} tools${usd}`;
  if (n.state === 'done') return n.note || (n.elapsed ? `${fmt(n.elapsed)} · ${n.tools || 0} tools${usd}` : 'done');
  if (n.state === 'waiting') return n.elapsed ? `${fmt(n.elapsed)} · paused` : 'paused';
  if (n.state === 'stalled') return 'no writes 10m+';
  return n.note || 'pending';
}

// estimates come from the median run time of finished agents with the same role (server side, 3+ runs)
const approx = s => s < 60 ? '<1m' : s < 3600 ? `~${Math.round(s / 60)}m` : `~${Math.floor(s / 3600)}h${String(Math.round(s % 3600 / 60)).padStart(2, '0')}m`;
const ago = s => s < 60 ? `${Math.max(0, Math.round(s))}s` : s < 3600 ? `${Math.floor(s / 60)}m` : `${Math.floor(s / 3600)}h${Math.floor(s % 3600 / 60)}m`;
const LIVE_ST = ['running', 'stalled'];
const over = (n, extra = 0) => n.elapsed + extra > n.est;
function estText(n, extra = 0) {
  if (!n.est || !LIVE_ST.includes(n.state)) return '';
  return `usually ${approx(n.est)} · ${over(n, extra) ? 'taking longer than usual' : `${approx(n.est - n.elapsed - extra)} left (estimate)`}`;
}
const actAgo = n => n.act && LIVE_ST.includes(n.state) ? ago(Date.now() / 1000 - n.act) : '';
const actText = n => actAgo(n) && `${n.state === 'stalled' ? 'stalled? · ' : ''}last activity ${actAgo(n)} ago`;
const etaText = eta => eta > 0 ? `${approx(eta)} left (estimate)` : 'longer than usual';  // every step left is past its median
const progText = n => n.total ? `${n.done}/${n.total} done${n.eta != null && n.done < n.total ? ` · ${etaText(n.eta)}` : ''}` : '';
const actSeen = new Map();  // key -> last activity seen, so a new tool call / text pulses the dot once
function pulse(dot, key, act) {
  const was = actSeen.get(key);
  actSeen.set(key, act);
  if (was && act > was && !reduced.matches && dot.animate)
    dot.animate([{transform: 'scale(1)'}, {transform: 'scale(2.2)', opacity: .5}, {transform: 'scale(1)'}], {duration: 600, easing: 'ease-out'});
}

/* layouts return {hub, boxes:[{x,y,n}], edges:[[d, from, to]], labels:[[x,y,text]], width, height} */
function layoutPipeline(p) {
  const boxes = [], edges = [], labels = [], pos = [];
  const x0 = PAD_X + HUB_W + 40;
  p.lanes.forEach((lane, li) => {
    const y = PAD_Y + li * ROW_H;
    labels.push([x0, y - 8, lane.name]);
    pos[li] = lane.stages.map((n, si) => ({x: x0 + si * (W + GX), y, n}));
    boxes.push(...pos[li]);
  });
  pos.forEach((lane, li) => {
    lane.forEach((a, si) => { const b = lane[si + 1]; if (b) edges.push([`M${a.x + W},${a.y + H / 2} L${b.x},${b.y + H / 2}`, a.n, b.n]); });
    const next = pos[li + 1];
    if (next && lane.length && next.length) {
      const a = lane[lane.length - 1], b = next[0];
      const x1 = a.x + W / 2, y1 = a.y + H, x2 = b.x + W / 2, y2 = b.y, my = (y1 + y2) / 2;
      edges.push([`M${x1},${y1} C${x1},${my + 20} ${x2},${my - 20} ${x2},${y2}`, a.n, b.n]);
    }
  });
  const all = boxes.map(b => b.n);
  const hubState = all.some(n => n.state === 'running') ? 'running' : all.every(n => n.state === 'done') ? 'done' : 'waiting';
  const firsts = pos.filter(l => l.length).map(l => {
    const sts = l.map(a => a.n.state);
    return [l[0], {state: sts.includes('running') ? 'running' : sts.every(s => s === 'done') ? 'done' : 'pending'}];
  });
  const cols = Math.max(...p.lanes.map(l => l.stages.length));
  return finish(boxes, edges, labels, hubState, firsts, x0 + cols * (W + GX), PAD_Y + p.lanes.length * ROW_H);
}

function layoutAuto(g) {
  // agents that overlap in time share a column (ran in parallel); later ones chain to the right
  const cols = [];
  for (const a of g.nodes) {
    const col = cols[cols.length - 1];
    if (col && a.t0 < Math.min(...col.map(c => c.t1))) col.push(a); else cols.push([a]);
  }
  const rows = Math.max(1, ...cols.map(c => c.length));
  const x0 = PAD_X + HUB_W + 50, boxes = [], edges = [], byCol = [];
  cols.forEach((col, ci) => {
    const top = PAD_Y + (rows - col.length) * ROW_H / 2;
    byCol[ci] = col.map((a, ri) => {
      const n = {...agentNode(a), t0: a.t0, t1: a.t1};
      const b = {x: x0 + ci * (W + GX), y: top + ri * ROW_H, n};
      boxes.push(b);
      return b;
    });
  });
  byCol.forEach((col, ci) => {
    if (!ci) return;
    col.forEach(b => {  // link from whichever agent in the previous column finished last before this one started
      const prev = byCol[ci - 1].filter(p => p.n.t1 <= b.n.t0 + 1).sort((p, q) => q.n.t1 - p.n.t1)[0] || byCol[ci - 1][0];
      const x1 = prev.x + W, y1 = prev.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
      edges.push([`M${x1},${y1} C${x1 + 25},${y1} ${x2 - 25},${y2} ${x2},${y2}`, prev.n, b.n]);
    });
  });
  const firsts = (byCol[0] || []).map(b => [b, b.n]);
  return finish(boxes, edges, [], g.waiting ? 'waiting' : g.live ? 'running' : 'done', firsts, x0 + cols.length * (W + GX), PAD_Y + rows * ROW_H);
}

const IND = 26, AG_H = 110;  // subagents: indented under their question, like a file tree

function agentNode(a) {
  return {id: a.id, label: a.desc, state: STATE[a.status] || 'pending', ask: a.note, tools: a.tools, elapsed: a.elapsed,
          usd: a.usd, last: a.last, type: a.type, errors: a.errors, act: a.act, est: a.est, runs: a.runs, role: a.role};
}

const turnCols = g => [...(g.earlier ? [{label: `+${g.earlier} earlier`, state: 'done', note: 'earlier questions', agents: []}] : []), ...g.turns];
const turnFlat = g => turnCols(g).flatMap(t => [t, ...t.agents.map(agentNode)]);  // same order draw() pushes boxes

function layoutTurns(g) {
  // the session as a timeline of your questions, left to right; each one's subagents listed below it
  const x0 = PAD_X + HUB_W + 40, boxes = [], edges = [], cols = turnCols(g);
  const deepest = Math.max(0, ...cols.map(t => t.agents.length));
  let prev = null;
  cols.forEach((t, i) => {
    const b = {x: x0 + i * (W + GX), y: PAD_Y, n: t};
    boxes.push(b);
    if (prev) edges.push([`M${prev.x + W},${prev.y + H / 2} L${b.x},${b.y + H / 2}`, prev.n, t]);
    t.agents.forEach((a, ai) => {
      const c = {x: b.x + IND, y: b.y + H + 18 + ai * AG_H, n: agentNode(a), w: W - IND};
      boxes.push(c);
      edges.push([`M${b.x + 12},${b.y + H} V${c.y + H / 2} H${c.x}`, t, c.n]);
    });
    prev = b;
  });
  const states = boxes.map(b => b.n.state);
  const hub = g.waiting || states.includes('waiting') ? 'waiting' : states.includes('running') ? 'running' : 'done';
  const L = finish(boxes, edges, [], hub, [], x0 + cols.length * (W + GX), PAD_Y + H + 18 + deepest * AG_H + 10);
  L.hub.y = PAD_Y;  // in line with the question row, not centred on the agent stack
  if (cols.length) L.edges.unshift([`M${L.hub.x + HUB_W},${PAD_Y + H / 2} L${x0},${PAD_Y + H / 2}`, {state: 'done'}, cols[0]]);
  L.hubTitle = '◎ Session';
  L.hubSub = `${g.turns.filter(t => t.state !== 'pending').length + (g.earlier || 0)} questions`;
  return L;
}

function finish(boxes, edges, labels, hubState, firsts, width, height) {
  const hub = {x: PAD_X, y: (height - PAD_Y) / 2 + PAD_Y / 2 - H / 2 + 4, state: hubState};
  firsts.forEach(([b, to]) => {
    const x1 = hub.x + HUB_W, y1 = hub.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
    edges.unshift([`M${x1},${y1} C${x1 + 25},${y1} ${x2 - 25},${y2} ${x2},${y2}`, {state: 'done'}, to]);
  });
  return {hub, boxes, edges, labels, width: width + PAD_X, height};
}

const keyOf = n => n.id ? `a:${n.id}` : n.agents ? `q:${n.t0 || n.label}` : `p:${n.label}`;

function draw(L) {
  const svg = document.getElementById('graph');
  svg.replaceChildren();
  content = {x: 0, y: 0, w: L.width, h: L.height};
  svg.style.height = `${Math.round(Math.max(360, Math.min(L.height + 20, innerHeight * 0.85)))}px`;
  if (auto || !vb) fit(autoK); else setVB();
  const eg = el('g', {}, svg), pg = el('g', {}, svg), ng = el('g', {}, svg);
  L.labels.forEach(([x, y, t]) => { el('text', {x, y, class: 'lane-label'}, svg).textContent = t; });
  L.edges.forEach(([d, from, to]) => {
    const cls = to.state === 'running' ? 'active' : (from.state === 'done' && to.state !== 'pending') ? 'done drawn' : '';
    const path = el('path', {d, class: `edge ${cls}`}, eg);
    if (cls.includes('drawn')) path.style.setProperty('--len', path.getTotalLength());
    if (cls === 'active') el('animateMotion', {dur: '1.4s', repeatCount: 'indefinite', path: d}, el('circle', {r: 5, class: 'packet'}, pg));
  });
  const hubN = {label: (L.hubTitle || '◎ Orchestrator').slice(2), state: L.hub.state, type: 'main session', hub: true,
                last: L.hubNote ? `⏸ ${L.hubNote}` : L.hubSub || 'main session'};
  const hg = el('g', {class: `node hub ${L.hub.state}`, transform: `translate(${L.hub.x},${L.hub.y})`, tabindex: 0, role: 'button', 'data-key': 'hub'}, ng);
  el('rect', {class: 'box', width: HUB_W, height: H, rx: H / 2}, hg);
  el('text', {x: HUB_W / 2, y: H / 2 - 2, class: 'title', 'text-anchor': 'middle'}, hg).textContent = L.hubTitle || '◎ Orchestrator';
  el('text', {x: HUB_W / 2, y: H / 2 + 14, class: 'sub', 'text-anchor': 'middle'}, hg).textContent = L.hub.state === 'waiting' && L.hubNote ? '⏸ waiting on you' : L.hubSub || 'main session';
  drawn = [{n: hubN, key: 'hub', g: hg}];
  L.boxes.forEach(({x, y, n, w = W}) => {
    const key = keyOf(n);
    const g = el('g', {class: `node ${n.state}${key === openKey ? ' sel' : ''}`, transform: `translate(${x},${y})`,
                       tabindex: 0, role: 'button', 'aria-label': `${n.label}, ${STATE_TXT[n.state] || n.state}`, 'data-key': key}, ng);
    el('rect', {class: 'box', width: w, height: H, rx: 12}, g);
    el('circle', {class: 'ring-bg', cx: 24, cy: H / 2, r: 10}, g);
    el('circle', {class: 'ring', cx: 24, cy: H / 2, r: 10}, g);
    if (n.state === 'done') el('path', {class: 'check', d: `M19,${H / 2} l4,4 l7,-8`}, g);
    if (n.state === 'running') {
      const bars = el('g', {class: 'bars', transform: `translate(${w - 24},${H - 24})`}, g);  // bottom-right, clear of the title
      [0, 6, 12].forEach(bx => el('rect', {x: bx, y: 0, width: 4, height: 12, rx: 1}, bars));
    }
    if (n.state === 'waiting') {  // paused, not loading: the agent is blocked until you answer
      const pz = el('g', {class: 'pause', transform: `translate(${w - 22},${H - 24})`}, g);
      [0, 7].forEach(bx => el('rect', {x: bx, y: 0, width: 4, height: 12, rx: 1}, pz));
    }
    const chars = px => Math.floor((w - 50 - px) / 6.6);
    el('text', {x: 44, y: 22, class: 'title'}, g).textContent = cut(n.label, Math.floor((w - 54) / 7.4));
    const meta = el('text', {x: 44, y: 40, class: 'meta'}, g);
    meta.textContent = cut(nodeMeta(n), chars(n.errors ? 48 : 0));
    if (n.errors) el('tspan', {class: 'errs'}, meta).textContent = ` · ${n.errors} err`;
    const doing = el('text', {x: 44, y: 59, class: 'doing'}, g);
    doing.textContent = cut(nodeDoing(n), chars(0));
    const sub = el('text', {x: 44, y: 78, class: 'sub'}, g);
    sub.textContent = subText(n);
    drawn.push({n, sub, doing, key, g, chars: Math.floor((w - 50) / 6.6)});
  });
}

/* pan + zoom: the svg viewBox is the camera; auto = follow the graph until you move it yourself */
let vb = null, content = {x: 0, y: 0, w: 1, h: 1}, auto = true, autoK = 0.75, drag = null, dragMoved = false;
function setVB() { document.getElementById('graph').setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function fit(minK = 0) {
  const svg = document.getElementById('graph'), cw = svg.clientWidth || 900, ch = svg.clientHeight || 320;
  const k = Math.max(minK, Math.min(1.25, cw / content.w, ch / content.h));
  const w = cw / k, h = ch / k;
  vb = {x: content.x + Math.min(0, (content.w - w) / 2), y: content.y + Math.min(0, (content.h - h) / 2), w, h};  // centre if small, else top-left
  setVB();
}
function zoom(f, cx, cy) {
  const r = document.getElementById('graph').getBoundingClientRect();
  cx = cx ?? r.left + r.width / 2; cy = cy ?? r.top + r.height / 2;
  const fx = (cx - r.left) / r.width, fy = (cy - r.top) / r.height;
  const k = Math.max(0.15, Math.min(4, r.width / vb.w * f)), w = r.width / k, h = r.height / k;
  vb = {x: vb.x + fx * (vb.w - w), y: vb.y + fy * (vb.h - h), w, h};
  auto = false;
  setVB();
}
function initPanZoom() {
  const svg = document.getElementById('graph');
  const nodeAt = e => { const g = e.target.closest && e.target.closest('.node'); return g && drawn.find(d => d.key === g.dataset.key); };
  svg.addEventListener('wheel', e => { e.preventDefault(); zoom(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, {passive: false});
  svg.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    dragMoved = false;
    drag = {x: e.clientX, y: e.clientY, vb: {...vb}};
  });
  addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!dragMoved && Math.hypot(dx, dy) < 4) return;  // a click, not a drag
    dragMoved = true; auto = false;
    svg.classList.add('dragging');
    const s = drag.vb.w / svg.clientWidth;
    vb = {...drag.vb, x: drag.vb.x - dx * s, y: drag.vb.y - dy * s};
    setVB();
  });
  addEventListener('pointerup', () => {
    drag = null;
    svg.classList.remove('dragging');
  });
  document.getElementById('zin').onclick = () => zoom(1.25);
  document.getElementById('zout').onclick = () => zoom(0.8);
  document.getElementById('zfit').onclick = () => { auto = true; autoK = 0; fit(0); };
  document.getElementById('texp').onclick = () => treeFold(t => true);
  document.getElementById('tcol').onclick = () => treeFold(t => t.anc.length && !isActive(t) ? false : undefined);
  const btns = document.querySelectorAll('.vsw button'), label = () => {
    btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.view === view));
    document.querySelector('.panel').classList.toggle('lanes', view === 'lanes');
    document.querySelector('.panel').classList.toggle('tree', view === 'tree');
    svg.classList.toggle('tree', view === 'tree');
    document.getElementById('hint').textContent = view === 'lanes' ? 'click a stage for details · ▸ opens a lane'
      : `click a card for details${view === 'tree' ? ' · ▸/▾ folds a branch' : ''} · drag to pan · wheel to zoom`;
  };
  label();
  btns.forEach(b => b.onclick = () => {
    view = b.dataset.view;
    try { localStorage.setItem('agentmon.layout', view); } catch (e) {}
    label();
    stopTree();
    svg.replaceChildren();
    sig = ''; auto = true; autoK = 0.75;
    if (last) showGraph(last);
  });
  addEventListener('resize', () => auto || !vb ? fit(autoK) : (vb.h = vb.w * svg.clientHeight / svg.clientWidth, setVB()));
  // nodes: click / Enter opens the detail drawer, hover shows the summary
  const tip = document.getElementById('tip');
  const togAt = e => e.target.closest && e.target.closest('.tog');
  svg.addEventListener('click', e => {
    const d = !dragMoved && nodeAt(e), t = !dragMoved && togAt(e);
    if (t) treeToggle(t.dataset.tk); else if (d) { tip.classList.remove('on'); openDetail(d); }
  });
  svg.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const d = nodeAt(e), t = togAt(e);
    if (t || d) e.preventDefault();
    if (t) treeToggle(t.dataset.tk); else if (d) openDetail(d);
  });
  svg.addEventListener('pointermove', e => {
    const d = e.pointerType !== 'touch' && !drag && nodeAt(e);
    tip.classList.toggle('on', !!d);
    if (!d) return;
    tip.textContent = [d.n.label, nodeMeta(d.n) + (d.n.errors ? ` · ${d.n.errors} tool errors` : ''), nodeDoing(d.n), subText(d.n),
                       actText(d.n), estText(d.n, (Date.now() - fetchedAt) / 1000), progText(d.n)].filter(Boolean).join('\n');
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
    tip.style.left = `${x}px`; tip.style.top = `${y}px`;
  });
  svg.addEventListener('pointerleave', () => tip.classList.remove('on'));
}

/* tree view: session -> lanes -> stages -> agents, left to right; ▸/▾ folds a branch. Cards keep their DOM across
   polls, so they only move (animated) when the shown shape changes. Your toggles beat the defaults (live branches open). */
let view = 'tree', T = null;
try { view = ['tree', 'lanes', 'flow'].find(x => x === localStorage.getItem('agentmon.layout')) || view; } catch (e) {}
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const TW = 250, TH = 100, TGX = 64, TROW = 112, LIVE = ['running', 'waiting', 'stalled'];
const treeOpen = {};  // session -> {tree key: open}
const leaves = t => t.kids.length ? t.kids.flatMap(leaves) : [t];
const isActive = t => LIVE.includes(t.n.state) || t.kids.some(isActive);
const aggState = sts => sts.includes('waiting') ? 'waiting' : sts.some(x => x === 'running' || x === 'stalled') ? 'running'
  : sts.every(x => x === 'pending') ? 'pending' : 'done';
const sum = (ts, k) => ts.reduce((a, t) => a + (t.n[k] || 0), 0);

function toggles(sid) {
  if (!treeOpen[sid]) try { treeOpen[sid] = JSON.parse(localStorage.getItem(`agentmon.tree.${sid}`)) || {}; } catch (e) { treeOpen[sid] = {}; }
  return treeOpen[sid];
}

function buildTree(v, hubNote) {
  const byId = new Map((v.g ? v.g.nodes : []).map(a => [a.id, a])), seen = new Set();
  const mk = (tk, dk, n, kids = []) => { while (seen.has(tk)) tk += '+'; seen.add(tk); return {tk, dk: dk || tk, n, kids}; };
  const lanes = (v.g ? v.g.lanes : v.p ? v.p.lanes : []).map(l => {
    const lk = `l:${l.name}`;
    const kids = l.stages.map((s, j) => {
      const sk = `${lk}/${j}`, ags = (s.ids || []).map(id => byId.get(id)).filter(Boolean);
      if (ags.length < 2) return mk(sk, s.id && `a:${s.id}`, {...s});
      return mk(sk, '', {...s, type: 'stage'}, ags.map(a => { const n = agentNode(a); return mk(`${sk}/${a.id}`, keyOf(n), n); }));
    });
    const ls = kids.flatMap(leaves), live = ls.find(t => LIVE.includes(t.n.state));
    return mk(lk, '', {label: l.name, type: 'lane', state: l.state || aggState(ls.map(t => t.n.state)), usd: l.usd, elapsed: l.elapsed,
                       done: l.done, total: l.total, eta: l.eta,
                       tools: sum(ls, 'tools'), last: live ? live.n.last : `${ls.filter(t => t.n.state === 'done').length}/${ls.length} done`}, kids);
  });
  const st = hubNote ? 'waiting' : aggState(lanes.map(t => t.n.state));
  return mk('root', 'hub', {label: 'Session', hub: true, type: 'main session', state: lanes.length ? st : 'done', ask: hubNote,
                            usd: v.usd, tools: sum(lanes, 'tools'), elapsed: Math.max(0, ...lanes.map(t => t.n.elapsed || 0)),
                            last: `${lanes.length} lane${lanes.length === 1 ? '' : 's'}`}, lanes);
}

function newCard(t) {
  const g = el('g', {}, T.ng), card = el('g', {tabindex: 0, role: 'button'}, g);
  const d = {g, card, edge: t.anc.length ? el('path', {}, T.eg) : null};
  el('rect', {class: 'box', width: TW, height: TH, rx: 10}, card);
  [['title', 22], ['meta', 41], ['doing', 59], ['sub', 76], ['est', 93]].forEach(([c, y]) => { d[c] = el('text', {x: 12, y, class: c}, card); });
  d.ago = el('text', {x: TW - 22, y: 20, class: 'ago', 'text-anchor': 'end'}, card);
  d.adot = el('circle', {cx: TW - 13, cy: 16, r: 4, class: 'adot'}, card);
  d.bar = el('g', {class: 'pbar', transform: `translate(12,${TH - 15})`}, card);
  el('rect', {width: 46, height: 6, rx: 3}, d.bar);
  d.fill = el('rect', {height: 6, rx: 3}, d.bar);
  d.tog = el('g', {class: 'tog', tabindex: 0, role: 'button', transform: `translate(${TW},${TH / 2})`}, g);
  el('circle', {r: 11}, d.tog);
  d.arrow = el('text', {'text-anchor': 'middle', y: 5}, d.tog);
  d.badge = el('text', {class: 'badge', x: TW + 18, y: TH / 2 + 5}, g);
  T.nodes.set(t.tk, d);
  return d;
}

function fillCard(d, t) {
  const n = t.n;
  d.card.setAttribute('class', `node ${n.state}${t.dk === openKey ? ' sel' : ''}`);
  d.card.dataset.key = t.dk;
  d.card.setAttribute('aria-label', `${n.label}, ${STATE_TXT[n.state] || n.state}`);
  const live = !!actAgo(n);
  d.title.textContent = cut(n.label, live ? 20 : 28);
  d.adot.style.display = live ? '' : 'none';
  d.adot.setAttribute('class', `adot${n.state === 'stalled' ? ' stall' : ''}`);
  d.ago.setAttribute('class', `ago${n.state === 'stalled' ? ' stall' : ''}`);
  if (live) pulse(d.adot, t.dk, n.act);
  d.bar.style.display = n.total ? '' : 'none';
  if (n.total) d.fill.setAttribute('width', 46 * n.done / n.total);
  d.est.setAttribute('x', n.total ? 66 : 12);
  d.upd = extra => {
    d.ago.textContent = live ? `${actAgo(n)} ago` : '';
    d.est.textContent = n.total ? progText(n).replace(' done', '') : estText(n, extra);
    d.est.setAttribute('class', `est${n.est && LIVE_ST.includes(n.state) && over(n, extra) ? ' over' : ''}`);
  };
  d.upd((Date.now() - fetchedAt) / 1000);
  d.meta.textContent = cut(`${n.type || 'stage'} · ${ICON[n.state] || '○'} ${STATE_TXT[n.state] || n.state}`, n.errors ? 22 : 33);
  if (n.errors) el('tspan', {class: 'errs'}, d.meta).textContent = ` · ${n.errors} err`;
  d.doing.textContent = cut(nodeDoing(n), 29);
  d.sub.textContent = subText(n);
  const ec = `edge ${n.state === 'running' || n.state === 'stalled' ? 'active' : n.state === 'waiting' ? 'wait' : n.state === 'done' ? 'done' : ''}`;
  if (d.edge && d.edge.getAttribute('class') !== ec) {  // finished links go underneath, so a shared trunk shows the live colour
    d.edge.setAttribute('class', ec);
    if (n.state === 'done') T.eg.prepend(d.edge); else T.eg.append(d.edge);
  }
  d.tog.style.display = t.kids.length ? '' : 'none';
  d.tog.dataset.tk = t.tk;
  d.tog.setAttribute('aria-expanded', t.open);
  d.tog.setAttribute('aria-label', `${t.open ? 'Collapse' : 'Expand'} ${n.label}`);
  d.arrow.textContent = t.open ? '▾' : '▸';
  d.badge.replaceChildren();
  if (!t.kids.length || t.open) return;
  const cnt = {};  // folded: what is underneath, e.g. 5 ✓ · 1 ◔
  leaves(t).forEach(l => { cnt[l.n.state] = (cnt[l.n.state] || 0) + 1; });
  Object.keys(cnt).sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b)).forEach((k, i) => {
    if (i) d.badge.append(' · ');
    el('tspan', {class: k}, d.badge).textContent = `${cnt[k]} ${ICON[k] || '○'}`;
  });
}
const ORDER = ['done', 'running', 'stalled', 'waiting', 'error', 'failed', 'pending'];

function treeUpdate(sid, root) {
  const svg = document.getElementById('graph');
  if (!T || T.sid !== sid) {
    stopTree();
    svg.replaceChildren();
    T = {sid, nodes: new Map(), eg: el('g', {}, svg), ng: el('g', {}, svg), raf: 0};
    vb = null; auto = true;
  }
  T.root = root;
  const open = toggles(sid), vis = [], all = [];
  let rows = 0, depth = 0;
  const place = (t, dep, anc) => {  // tidy tree: each shown leaf gets a row, a parent lines up with its first child (stays in view)
    t.anc = anc;
    t.open = !!t.kids.length && (open[t.tk] ?? (!dep || t.kids.some(isActive)));
    if (t.open) { t.kids.forEach(c => place(c, dep + 1, [t.tk, ...anc])); t.y = t.kids[0].y; }
    else t.y = 10 + rows++ * TROW;
    t.x = 10 + dep * (TW + TGX);
    depth = Math.max(depth, dep);
    vis.push(t);
  };
  place(root, 0, []);
  const shown = new Map(vis.map(t => [t.tk, t]));
  let moved = false;
  for (const t of vis) {  // children come before parents here, so a new card grows out of its nearest old ancestor
    let d = T.nodes.get(t.tk);
    if (!d) {
      const p = t.anc.map(k => T.nodes.get(k)).find(Boolean) || t;
      d = newCard(t);
      Object.assign(d, {x: p.x, y: p.y, enter: true});
    }
    Object.assign(d, {t, gone: false, fx: d.x, fy: d.y, tx: t.x, ty: t.y});
    if (d.x !== t.x || d.y !== t.y) moved = true;
    fillCard(d, t);
  }
  for (const d of T.nodes.values()) if (!shown.has(d.t.tk) && !d.gone) {  // folded away: shrink into the shown ancestor
    const p = d.t.anc.map(k => shown.get(k)).find(Boolean) || d;
    Object.assign(d, {gone: true, fx: d.x, fy: d.y, tx: p.x, ty: p.y});
    moved = true;
  }
  const walk = t => { all.push(t); t.kids.forEach(walk); };
  walk(root);
  drawn = all.map(t => { const d = shown.has(t.tk) && T.nodes.get(t.tk); return d ? {n: t.n, key: t.dk, g: d.card, sub: d.sub, doing: d.doing, chars: 29, upd: d.upd} : {n: t.n, key: t.dk, g: h('i')}; });
  if (!moved && vb) return;
  content = {x: 0, y: 0, w: 20 + (depth + 1) * (TW + TGX) + 60, h: 20 + rows * TROW - (TROW - TH)};
  svg.style.height = `${Math.round(Math.max(480, Math.min(content.h * autoK + 20, innerHeight * 0.88)))}px`;
  if (auto || !vb) fit(autoK);
  T.start = performance.now();
  if (!T.raf) T.raf = requestAnimationFrame(treeFrame);
}

function treeFrame(now) {
  const k = reduced.matches ? 1 : Math.min(1, (now - T.start) / 280), e = 1 - (1 - k) ** 3;
  for (const d of T.nodes.values()) {
    d.x = d.fx + (d.tx - d.fx) * e; d.y = d.fy + (d.ty - d.fy) * e;
    d.g.setAttribute('transform', `translate(${d.x},${d.y})`);
    d.g.style.opacity = k < 1 && (d.gone || d.enter) ? (d.gone ? 1 - e : e) : '';
  }
  for (const d of T.nodes.values()) {
    const p = d.edge && T.nodes.get(d.t.anc[0]);
    if (!p) continue;
    // rounded elbow: siblings share one trunk instead of a fan of crossing curves
    const y1 = p.y + TH / 2, y2 = d.y + TH / 2, x1 = p.x + TW, x2 = d.x, m = (x1 + x2) / 2, dy = y2 - y1;
    const r = Math.min(12, Math.abs(dy) / 2) * Math.sign(dy);
    d.edge.setAttribute('d', `M${x1},${y1} H${m - Math.abs(r)} Q${m},${y1} ${m},${y1 + r} V${y2 - r} Q${m},${y2} ${m + Math.abs(r)},${y2} H${x2}`);
    d.edge.style.opacity = d.g.style.opacity;
  }
  if (k < 1) { T.raf = requestAnimationFrame(treeFrame); return; }
  T.raf = 0;
  for (const [key, d] of T.nodes) {
    d.enter = false;
    if (d.gone) { d.g.remove(); if (d.edge) d.edge.remove(); T.nodes.delete(key); }
  }
}
function stopTree() { if (T && T.raf) cancelAnimationFrame(T.raf); T = null; }

function treeFold(f) {  // f(node) -> true / false / undefined (leave as is), over every node with children
  if (!T) return;
  const open = toggles(T.sid), each = t => { const o = t.kids.length && f(t); if (o !== undefined && t.kids.length) open[t.tk] = o; t.kids.forEach(each); };
  each(T.root);
  try { localStorage.setItem(`agentmon.tree.${T.sid}`, JSON.stringify(open)); } catch (e) {}
  treeUpdate(T.sid, T.root);
}
const treeToggle = tk => treeFold(t => t.tk === tk ? !t.open : undefined);

function tick() {  // live clocks and "now doing" lines without re-rendering (keeps animations smooth)
  const extra = (Date.now() - fetchedAt) / 1000;
  drawn.forEach(({n, sub, doing, chars, upd}) => {
    if (sub && n.state === 'running') sub.textContent = subText(n, extra);
    if (doing) doing.textContent = chars ? cut(nodeDoing(n), chars) : nodeDoing(n);
    if (upd) upd(extra);
  });
  laneClocks.forEach(({el, l}) => { el.textContent = laneMeta(l, extra); });
}

/* lanes board: one row per lane (server-side `lanes`); live lanes open on top, finished ones fold to a line of chips */
const laneOpen = new Map();  // session|lane -> open, once you toggle it; survives the 2 s polls
let laneClocks = [];
const ICON = {done: '✓', running: '◔', stalled: '◔', waiting: '⏸', error: '✗', failed: '✗'};
const GROUP = {running: '● Running', waiting: '● Running', done: 'Finished', pending: 'Not started'};
const laneMeta = (l, extra = 0) => [l.eta != null && l.done < l.total ? etaText(l.eta) : '', l.usd ? `$${l.usd.toFixed(2)}` : '',
  l.elapsed ? fmt(l.elapsed + (GROUP[l.state] === GROUP.running ? extra : 0)) : ''].filter(Boolean).join(' · ');

function renderLanes(lanes) {
  const board = document.getElementById('board'), f = document.activeElement;
  const refocus = board.contains(f) && (f.dataset.key || f.dataset.lane);
  const parts = [];
  drawn = []; laneClocks = [];
  if (!lanes.length) parts.push(h('p', 'now', 'No subagents in this session yet.'));
  lanes.forEach((l, i) => {
    if (!i || GROUP[l.state] !== GROUP[lanes[i - 1].state]) parts.push(h('h4', GROUP[l.state] === GROUP.running ? 'live' : '', GROUP[l.state] || l.state));
    const lk = `${selected}|${l.name}`, live = GROUP[l.state] === GROUP.running;
    const open = laneOpen.has(lk) ? laneOpen.get(lk) : live;
    const row = h('div', 'lane'), head = h('button', 'lhead'), meta = h('span', 'lmeta', laneMeta(l));
    head.dataset.lane = lk;
    head.setAttribute('aria-expanded', open);
    head.append(h('span', 'caret', open ? '▾' : '▸'), h('span', 'lname', l.name));
    if (l.total) {  // steps done / total
      const bar = h('span', 'prog'), fill = h('i');
      fill.style.width = `${100 * l.done / l.total}%`;
      bar.append(fill);
      head.append(bar, h('span', 'lprog', `${l.done}/${l.total}`));
      head.setAttribute('aria-label', `${l.name}, ${l.done} of ${l.total} done`);
    }
    head.onclick = () => { laneOpen.set(lk, !open); renderLanes(lanes); };
    if (live) laneClocks.push({el: meta, l});
    const box = h('div', open ? 'cards' : 'chips');
    l.stages.forEach((s, j) => box.append(stageEl(l, s, j, open)));
    row.append(head, ...(open ? [meta, box] : [box, meta]));
    parts.push(row);
  });
  board.replaceChildren(...parts);
  const back = refocus && [...board.querySelectorAll('[data-key],[data-lane]')].find(e => (e.dataset.key || e.dataset.lane) === refocus);
  if (back) back.focus({preventScroll: true});
}

function stageEl(l, s, j, card) {
  const key = s.id ? `a:${s.id}` : `s:${l.name}:${j}`, n = {...s}, ic = h('span', 'ic', ICON[s.state] || '○');
  const b = h('button', `${card ? 'scard' : 'chip'} ${s.state}${key === openKey ? ' sel' : ''}`), d = {n, key, g: b};
  b.dataset.key = key;
  if (!card) {
    b.title = `${s.label} · ${STATE_TXT[s.state] || s.state}`;
    b.append(ic, cut(s.label, 32));
  } else {
    const t = h('b'), m = h('small', '', nodeMeta(n));
    t.append(ic, s.label);
    if (s.errors) m.append(h('span', 'errs', ` · ${s.errors} err`));
    b.append(t, m);
    if (s.desc && s.desc !== s.label) b.append(h('small', '', s.desc));
    if (s.last || !['done', 'pending'].includes(s.state)) b.append(d.doing = h('span', 'doing', nodeDoing(n)));
    b.append(d.sub = h('small', '', subText(n)));
    if (actAgo(n)) {
      const dot = h('span', `adot${n.state === 'stalled' ? ' stall' : ''}`), act = h('small', `act${n.state === 'stalled' ? ' stall' : ''}`), est = h('small', 'est');
      act.append(dot, d.actEl = h('span', '', actText(n)));
      b.append(act, est);
      pulse(dot, key, n.act);
      d.upd = extra => { d.actEl.textContent = actText(n); est.textContent = estText(n, extra); est.className = `est${n.est && over(n, extra) ? ' over' : ''}`; };
      d.upd((Date.now() - fetchedAt) / 1000);
    }
  }
  b.onclick = () => openDetail(d);
  drawn.push(d);
  return b;
}

function views(s) {
  // one view per session; the hand-written pipeline replaces the auto graph for its session
  const v = s.graphs.map(g => ({id: g.session, live: g.live, waiting: g.waiting, usd: g.usd, title: g.title, project: g.project, g}));
  for (const p of s.pipelines) {
    const hit = v.find(x => x.id === p.session);
    if (hit) Object.assign(hit, {p, title: p.title});
    else v.push({id: p.session || p.title, live: false, usd: 0, title: p.title, project: '', p});
  }
  return v;
}

function showGraph(s) {
  const vs = views(s);
  if (!vs.length) { stopTree(); document.getElementById('tabs').replaceChildren(); document.getElementById('graph').replaceChildren(); document.getElementById('board').replaceChildren(); document.getElementById('now').replaceChildren(); document.getElementById('psub').textContent = ''; drawn = []; sig = ''; document.getElementById('ptitle').textContent = 'No live sessions'; updateCards('<p>No live sessions in the watched repos. Sessions show here while they or their agents are working.</p>'); return; }
  if (!vs.some(v => v.id === selected)) selected = vs[0].id;
  const tabs = document.getElementById('tabs');
  tabs.replaceChildren(...vs.map(v => {
    const b = document.createElement('button');
    b.className = `tab${v.id === selected ? ' sel' : ''}${v.live ? ' live' : ''}${v.waiting ? ' waiting' : ''}`;
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', v.id === selected);
    b.title = `${v.title} (${v.project} · ${v.id})`;
    b.innerHTML = '<span class="dot"></span>';
    b.append(`${v.waiting ? '⏸ ' : ''}${cut(v.title, 38)}${v.usd ? ` · $${v.usd.toFixed(2)}` : ''}`);
    b.onclick = () => { selected = v.id; try { localStorage.setItem('agentmon.session', v.id); } catch (e) {} sig = ''; showGraph(last); };
    return b;
  }));
  const v = vs.find(x => x.id === selected);
  updateCards(s.cards[selected] || '');
  document.getElementById('ptitle').textContent = cut(v.title, 90);
  document.getElementById('psub').textContent = `${v.project} · s:${v.id}${v.p ? ' · pipeline' : ' · auto'}`;
  const turns = !v.p && v.g.turns && v.g.turns.length;
  const pl = v.p && (v.g ? v.g.lanes : v.p.lanes);  // the server's lanes add workflow runs and 'Other' to the pipeline's
  const data = pl ? pl.flatMap(l => l.stages) : turns ? turnFlat(v.g) : v.g.nodes;
  const hubNote = v.g ? v.g.note : '';
  const newSig = selected + hubNote + JSON.stringify(data.map(n => [n.label || n.desc, n.state || n.status, n.note]));
  if (view === 'lanes') renderLanes(v.g ? v.g.lanes : []);
  else if (view === 'tree') treeUpdate(selected, buildTree(v, hubNote));
  else if (newSig !== sig) {
    sig = newSig;
    const L = pl ? layoutPipeline({lanes: pl}) : turns ? layoutTurns(v.g) : layoutAuto(v.g);
    if (hubNote) L.hub.state = 'waiting';
    L.hubNote = hubNote;
    draw(L);
  }
  else {
    const fresh = v.p || turns ? data : v.g.nodes.map(a => ({tools: a.tools, elapsed: a.elapsed, usd: a.usd, last: a.last, errors: a.errors}));
    drawn.slice(1).forEach((x, i) => Object.assign(x.n, fresh[i]));  // drawn[0] is the hub
    tick();
  }
  const now = document.getElementById('now');
  const line = (cls, head, text) => {
    const d = document.createElement('div');
    const b = document.createElement('b');
    d.className = cls;
    b.textContent = head;
    d.append(b, text);
    return d;
  };
  now.replaceChildren(
    ...(hubNote ? [line('wait', '⏸ Orchestrator: ', `waiting on you — ${hubNote}`)] : []),
    ...drawn.filter(x => !x.n.hub && x.n.state === 'waiting').map(({n}) => line('wait', `⏸ ${cut(n.label, 40)}: `, `waiting on you${n.ask || n.note ? ` — ${n.ask || n.note}` : ''}`)),
    ...drawn.filter(x => !x.n.hub && x.n.state === 'running').map(({n}) => line('', `▶ ${cut(n.label, 40)}: `, n.last || '…')));
}

function updateCards(htmlStr) {
  const box = document.getElementById('cards');
  box.querySelectorAll('details').forEach(d => {
    if (d.open) { opened.add(d.dataset.id); closed.delete(d.dataset.id); }
    else { closed.add(d.dataset.id); opened.delete(d.dataset.id); }
  });
  box.innerHTML = htmlStr;
  box.querySelectorAll('details').forEach(d => {
    const id = d.dataset.id;
    d.open = opened.has(id) || (!closed.has(id) && ['running', 'active', 'waiting'].includes(d.dataset.status));
    if (!seenCards.has(id)) { d.classList.add('fresh'); seenCards.add(id); }
  });
}

/* detail drawer: lazy-loads /api/agent for the clicked node, refreshed on each poll while it is open */
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const clock = t => t ? new Date(t).toLocaleTimeString([], {hour12: false}) : '';
const ktok = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);

function openDetail(d) {
  openKey = d.key;
  detail = null;
  document.querySelectorAll('[data-key].sel').forEach(g => g.classList.remove('sel'));
  d.g.classList.add('sel');
  const dr = document.getElementById('drawer');
  dr.classList.add('open');
  dr.setAttribute('aria-hidden', 'false');
  renderDetail();
  loadDetail();
  document.getElementById('dclose').focus();
}

function closeDetail() {
  const dr = document.getElementById('drawer'), g = document.querySelector(`[data-key="${CSS.escape(openKey || '')}"]`);
  dr.classList.remove('open');
  dr.setAttribute('aria-hidden', 'true');
  document.querySelectorAll('[data-key].sel').forEach(g => g.classList.remove('sel'));
  openKey = detail = null;
  if (g) g.focus();
}

async function loadDetail() {
  const key = openKey, id = key === 'hub' || key.startsWith('q:') ? 'main' : key.startsWith('a:') ? key.slice(2) : null;
  if (!id) return;
  try {
    const r = await fetch(`/api/agent?s=${encodeURIComponent(selected)}&id=${encodeURIComponent(id)}`, {cache: 'no-store'});
    if (key !== openKey) return;  // another node was opened meanwhile
    detail = r.ok ? await r.json() : {missing: true};
  } catch (e) { detail = {missing: true}; }
  renderDetail();
}

function renderDetail() {
  const d = drawn.find(x => x.key === openKey);
  if (!d) return;
  const n = d.n, q = openKey.startsWith('q:'), data = detail || {};
  document.getElementById('dtitle').textContent = n.label;
  const body = document.getElementById('dbody'), keepScroll = body.scrollTop;
  const head = h('p');
  head.append(h('span', `pill ${n.state}`, STATE_TXT[n.state] || n.state), h('span', 'pill', nodeMeta(n).split(' · ')[0]));
  if (n.errors || data.errors) head.append(h('span', 'pill err', `${n.errors || data.errors} tool error${(n.errors || data.errors) > 1 ? 's' : ''}`));
  // a question is a window of the main session: keep only what happened between it and the next one
  const open = n.state === 'running' || n.state === 'waiting';
  const t0 = q && n.t0 ? n.t0 - 1 : -Infinity, t1 = q && n.t0 && !open ? n.t0 + n.elapsed + 2 : Infinity;
  const items = (data.timeline || []).filter(i => { const t = Date.parse(i.t) / 1000; return !(t < t0 || t > t1); });
  const tok = data.tok;
  const kv = h('dl', 'kv');
  const row = (k, v) => v && kv.append(h('dt', '', k), h('dd', '', v));
  row('Started', q && n.t0 ? new Date(n.t0 * 1000).toLocaleString([], {hour12: false}) : data.start);
  row('Elapsed', fmt(q || !data.elapsed ? n.elapsed || 0 : data.elapsed));
  row(open ? 'Now doing' : 'Last action', nodeDoing(n));
  row('Last activity', n.act && !['done', 'pending'].includes(n.state) ? `${n.state === 'stalled' ? 'stalled? · ' : ''}${ago(Date.now() / 1000 - n.act)} ago (${clock(n.act * 1000)})` : '');
  row('Progress', progText(n));
  if (n.role) row('Estimate', n.est ? `usually ${approx(n.est)} (median of ${n.runs} finished “${n.role}” runs)${LIVE_ST.includes(n.state)
    ? ` · ${over(n, (Date.now() - fetchedAt) / 1000) ? 'taking longer than usual' : `${approx(n.est - n.elapsed - (Date.now() - fetchedAt) / 1000)} left`}` : ''} · estimate`
    : `none yet: ${n.runs} finished “${n.role}” run${n.runs === 1 ? '' : 's'}, needs 3`);
  row('Tools', `${q ? n.tools : data.tools ?? n.tools ?? 0} calls${data.errors && !q ? ` · ${data.errors} errors` : ''}`);
  row('Cost', n.usd || tok ? `$${(q ? n.usd || 0 : tok ? tok.usd : n.usd).toFixed(2)}` : '');
  if (tok) row(q ? 'Session tokens' : 'Tokens', `in ${ktok(tok.input)} · out ${ktok(tok.output)} · cache read ${ktok(tok.cache_read)} · cache write ${ktok(tok.cache_write)}`);
  const parts = [head, kv];
  const section = (title, text) => text && parts.push(h('h4', '', title), h('pre', '', text));
  section(q ? 'Question' : n.hub ? 'First question' : 'Prompt', q ? n.label : data.prompt);
  const result = q ? [...items].reverse().find(i => i.kind === 'text')?.what : data.result;
  if (n.state === 'done' || n.hub) section(n.hub ? 'Latest reply' : 'Result', result);
  if (data.missing) parts.push(h('p', 'now', 'No transcript details for this node.'));
  else if (!detail && (openKey === 'hub' || /^[aq]:/.test(openKey))) parts.push(h('p', 'now', 'loading…'));
  if (items.length) {
    parts.push(h('h4', '', `Timeline · ${items.length}${data.total > items.length && !q ? ` of ${data.total}` : ''} (newest first)`));
    const ol = h('ol');
    [...items].reverse().forEach(i => {
      const li = h('li', i.kind === 'text' ? 'text' : i.ok === false ? 'error' : '');
      li.append(h('span', '', `${clock(i.t)} `));
      if (i.kind === 'tool') li.append(h('span', i.ok === false ? 'bad' : i.ok ? 'ok' : '', i.ok === false ? '✗ ' : i.ok ? '✓ ' : '… '), h('b', '', i.name), ` ${i.what}`);
      else li.append(i.what);
      ol.append(li);
    });
    parts.push(ol);
  }
  body.replaceChildren(...parts);
  body.scrollTop = keepScroll;
}

addEventListener('keydown', e => { if (e.key === 'Escape' && openKey) closeDetail(); });
document.getElementById('dclose').onclick = closeDetail;
initPanZoom();

let pageAt = null;
async function poll() {
  try {
    const s = await (await fetch('/api', {cache: 'no-store'})).json();
    if (pageAt != null && s.page !== pageAt) return location.reload();  // the page itself was updated
    pageAt = s.page;
    fetchedAt = Date.now();
    last = s;
    const c = s.counts;
    document.getElementById('counts').textContent =
      `${s.scopes.join(', ') || 'no watched repos'} · ${c.waiting} waiting on you · ${c.active} active sessions · ${c.running} running agents · ${c['stalled?']} stalled? · ${c.done} done · $${c.usd.toFixed(2)} · hides ${s.hide_after_min}m after last activity · live`;
    document.title = c.waiting ? `⏸ (${c.waiting}) waiting · Agent Monitor` : 'Agent Monitor';
    showGraph(s);
    if (openKey) {
      const d = drawn.find(x => x.key === openKey);
      if (!d) closeDetail(); else { d.g.classList.add('sel'); if (d.n.state !== 'done' || !detail) loadDetail(); else renderDetail(); }
    }
    if (navigator.setAppBadge) (c.waiting ? navigator.setAppBadge(c.waiting) : navigator.clearAppBadge()).catch(() => {});  // Dock icon badge
  } catch (e) {
    document.getElementById('counts').textContent = 'server unreachable — retrying…';
  }
}
poll();
setInterval(poll, 2000);
setInterval(tick, 1000);
</script>
</body>
</html>
